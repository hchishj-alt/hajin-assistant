# 지원사업·창업 정보와 대외활동(공모전·서포터즈)을 매일 자동 수집 (무료). 결과는 data/feed.json, data/acts.json 에 쌓이고 앱이 그걸 읽어요.
name: feed
on:
  schedule:
    - cron: '40 21 * * *'   # 매일 한국 시간 아침 6:40
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-feed.mjs
      - run: node scripts/fetch-acts.mjs
        continue-on-error: true   # 대외활동 수집이 실패해도 지원사업 결과는 올라가게
      - run: |
          git config user.name "feed-bot"
          git config user.email "feed@users.noreply.github.com"
          git add data/feed.json data/acts.json
          git commit -m "지원사업·대외활동 새로 모음" || exit 0
          git push
